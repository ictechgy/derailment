name: Publish to PyPI

# Publishes on GitHub Releases via PyPI trusted publishing.
# One-time setup on PyPI: add the project as a "trusted publisher"
# (repo + workflow file + environment), then tag a release.

on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,tui]"
      - name: Test
        run: python -m pytest -q
      - name: Version consistency (pyproject == __version__ == CITATION == tag)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import sys; sys.path.insert(0,'src'); import derailment; print(derailment.__version__)")
          CFF=$(grep '^version:' CITATION.cff | awk '{print $2}')
          echo "tag=$TAG pyproject=$PY init=$INIT cff=$CFF"
          test "$TAG" = "$PY" && test "$PY" = "$INIT" && test "$PY" = "$CFF"

  publish:
    runs-on: ubuntu-latest
    environment: pypi
    needs: verify
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Sanity-check the sdist test suite imports
        run: |
          python -m pip install dist/*.tar.gz
          python - <<'PY'
          import derailment
          print("installed", derailment.__version__)
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
