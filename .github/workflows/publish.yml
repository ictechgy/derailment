name: Publish to PyPI

# Publishes on GitHub Releases via PyPI trusted publishing.
# One-time setup on PyPI: add the project as a "trusted publisher"
# (repo + workflow file + environment), then tag a release.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
